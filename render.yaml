# Render Blueprint — HOA Committee Portal
# New → Blueprint → select this repo. Render creates the web service and the PostgreSQL database.
# You still need to set APP_URL to your final URL.
# Uploaded documents are stored on a Render Persistent Disk (kept across deploys, snapshotted daily).

databases:
  - name: hoa-portal-db
    databaseName: hoa_portal
    user: hoa_portal
    plan: basic-256mb        # Paid plans include automated daily backups + point-in-time recovery.
    postgresMajorVersion: "16"

services:
  - type: web
    name: hoa-committee-portal
    runtime: node
    plan: starter            # Free instances sleep; starter keeps the portal responsive.
    buildCommand: npm ci --include=dev && npm run build
    # Migrations run ONCE per deploy, before the new version starts — never at app startup.
    preDeployCommand: npx prisma migrate deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: hoa-uploads
      mountPath: /var/data
      sizeGB: 1               # Plenty for committee documents; can be increased later, never decreased.
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hoa-portal-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_AUTH_SECRET
        generateValue: true
      - key: PIN_HASH_SECRET
        generateValue: true   # Never change after PINs are issued — it would invalidate every PIN.
      - key: SETUP_TOKEN
        generateValue: true   # Copy from the dashboard to use /admin/setup once; then delete it.
      - key: ORG_NAME
        value: "Our HOA"
      # ---- Selling to many HOAs (see README "Running it for many HOAs") ----
      # Your brand's domain, e.g. committeedesk.com. Leave empty to keep single-HOA mode.
      - key: ROOT_DOMAIN
        sync: false
      # Your software's name, shown on the main site and owner console.
      - key: PLATFORM_NAME
        sync: false
      # Optional: email for the "Contact sales" link on the main site.
      - key: SALES_EMAIL
        sync: false
      # Optional: which HOA the onrender.com address shows once ROOT_DOMAIN is set (e.g. your first HOA's slug).
      - key: DEFAULT_ORG_SLUG
        sync: false
      - key: ORG_TIMEZONE
        value: America/New_York
      - key: APP_URL
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # Optional: switch to S3-compatible object storage later by adding
      # S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY, S3_REGION in the dashboard.
