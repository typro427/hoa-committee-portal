<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HOA Committees</title>
<style>
  :root { --navy:#152340; --navy2:#1c2f50; --slate:#475569; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--navy); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%; }
  body { display:flex; flex-direction:column; color:#fff; }
  .top { padding:48px 24px 28px; text-align:center; }
  .top img { width:76px; height:76px; border-radius:18px; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  .top h1 { font-size:26px; margin:16px 0 4px; }
  .top p { margin:0; color:#bccde6; font-size:15px; }
  .card { flex:1; background:#f1f5f9; color:#0f172a; border-radius:24px 24px 0 0; padding:24px 20px 40px; }
  label { display:block; font-weight:600; font-size:15px; margin-bottom:8px; color:#152340; }
  input { width:100%; height:54px; border:1px solid #cbd5e1; border-radius:14px; padding:0 14px; font-size:17px; background:#fff; color:#0f172a; }
  input:focus { outline:none; border-color:#3f6198; box-shadow:0 0 0 3px rgba(63,97,152,.25); }
  .hint { font-size:13px; color:var(--slate); margin:8px 2px 0; line-height:1.4; }
  button.primary { margin-top:18px; width:100%; height:56px; border:0; border-radius:14px; background:var(--navy2); color:#fff; font-size:18px; font-weight:700; }
  button.primary:disabled { opacity:.55; }
  .err { display:none; margin-top:14px; padding:12px 14px; border-radius:12px; background:#fef2f2; color:#b91c1c; font-size:14px; line-height:1.4; }
  .err button { margin-top:10px; background:none; border:0; color:#1c2f50; font-weight:700; font-size:14px; padding:0; text-decoration:underline; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:#64748b; margin:30px 2px 10px; }
  .recent { display:flex; flex-direction:column; gap:10px; }
  .recent a { display:flex; align-items:center; justify-content:space-between; gap:10px; background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:14px 16px; color:#152340; text-decoration:none; font-weight:600; font-size:16px; }
  .recent a small { display:block; font-weight:400; color:#64748b; font-size:13px; margin-top:2px; word-break:break-all; }
  .recent .x { color:#94a3b8; font-size:22px; padding:0 4px; border:0; background:none; }
  .splash { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:var(--navy); color:#bccde6; font-size:15px; }
  .splash img { width:76px; height:76px; border-radius:18px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
  <div id="splash" class="splash hidden"><img src="logo.png" alt="" /><div>Opening your portal…</div></div>
  <div class="top">
    <img src="logo.png" alt="" />
    <h1>HOA Committees</h1>
    <p>Meetings, minutes, documents &amp; tasks</p>
  </div>
  <div class="card">
    <form id="f" novalidate>
      <label for="addr">Your HOA's portal address</label>
      <input id="addr" type="url" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false"
             placeholder="deerfield.yourhoa.com" autocomplete="url" />
      <p class="hint">It's the web address your HOA administrator sent you, e.g. <b>deerfield.yourhoa.com</b> or <b>your-portal.onrender.com</b>.</p>
      <button class="primary" id="go" type="submit">Continue</button>
      <div class="err" id="err"><span id="errText"></span><br /><button type="button" id="anyway">Open it anyway</button></div>
    </form>
    <div id="recentWrap" class="hidden">
      <h2>Your HOAs</h2>
      <div class="recent" id="recent"></div>
    </div>
  </div>
<script>
(function () {
  var KEY = "hoa.current", LIST = "hoa.recent";
  var params = new URLSearchParams(location.search);
  function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  // Normalize what people type: "deerfield.yourhoa.com/login" -> "https://deerfield.yourhoa.com"
  function normalize(raw) {
    var s = (raw || "").trim().toLowerCase().replace(/\s+/g, "");
    if (!s) return null;
    if (!/^https?:\/\//.test(s)) s = "https://" + s;
    try { var u = new URL(s); if (!u.hostname.includes(".") && u.hostname !== "localhost") return null; return u.origin; } catch (e) { return null; }
  }
  function open(origin, name) {
    var list = load(LIST, []).filter(function (h) { return h.url !== origin; });
    list.unshift({ url: origin, name: name || origin.replace(/^https?:\/\//, "") });
    save(LIST, list.slice(0, 8)); save(KEY, origin);
    document.getElementById("splash").classList.remove("hidden");
    location.replace(origin + "/login");
  }

  // Returning user: jump straight to their HOA (unless they tapped "Switch HOA").
  var current = load(KEY, null);
  if (current && !params.has("switch")) { document.getElementById("splash").classList.remove("hidden"); location.replace(current + "/login"); return; }

  function renderRecent() {
    var list = load(LIST, []), box = document.getElementById("recent");
    document.getElementById("recentWrap").classList.toggle("hidden", list.length === 0);
    box.innerHTML = "";
    list.forEach(function (h) {
      var a = document.createElement("a"); a.href = "#";
      var t = document.createElement("span"); t.textContent = h.name;
      var sm = document.createElement("small"); sm.textContent = h.url.replace(/^https?:\/\//, ""); t.appendChild(sm);
      var x = document.createElement("button"); x.className = "x"; x.type = "button"; x.setAttribute("aria-label", "Remove " + h.name); x.textContent = "×";
      x.onclick = function (e) { e.preventDefault(); e.stopPropagation(); save(LIST, load(LIST, []).filter(function (o) { return o.url !== h.url; })); if (load(KEY, null) === h.url) localStorage.removeItem(KEY); renderRecent(); };
      a.appendChild(t); a.appendChild(x);
      a.onclick = function (e) { e.preventDefault(); open(h.url, h.name); };
      box.appendChild(a);
    });
  }
  renderRecent();

  var pending = null;
  function showErr(msg, origin) { pending = origin; document.getElementById("errText").textContent = msg; document.getElementById("err").style.display = "block"; }
  document.getElementById("anyway").onclick = function () { if (pending) open(pending); };

  document.getElementById("f").onsubmit = function (e) {
    e.preventDefault();
    document.getElementById("err").style.display = "none";
    var origin = normalize(document.getElementById("addr").value);
    if (!origin) return showErr("That doesn't look like a web address. Check the link your HOA sent you.", null);
    var btn = document.getElementById("go"); btn.disabled = true; btn.textContent = "Checking…";
    // Confirm it's a committee portal before saving it.
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; btn.disabled = false; btn.textContent = "Continue"; showErr("That address is taking too long to answer. Check your connection.", origin); } }, 12000);
    fetch(origin + "/api/health", { headers: { Accept: "application/json" } })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (done) return; done = true; clearTimeout(timer);
        if (j && j.status === "ok") open(origin);
        else { btn.disabled = false; btn.textContent = "Continue"; showErr("We reached that address, but it doesn't look like a committee portal.", origin); }
      })
      .catch(function () {
        if (done) return; done = true; clearTimeout(timer);
        btn.disabled = false; btn.textContent = "Continue";
        showErr("We couldn't reach that address. Check the spelling and your internet connection.", origin);
      });
  };
})();
</script>
</body>
</html>
