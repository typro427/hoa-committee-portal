<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Can't connect</title>
<style>
  html,body { margin:0; height:100%; background:#f1f5f9; font-family:-apple-system,BlinkMacSystemFont,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; }
  .card { max-width:22rem; margin:20px; background:#fff; border:1px solid #e2e8f0; border-radius:20px; padding:28px 22px; text-align:center; color:#152340; }
  img { width:64px; height:64px; border-radius:14px; }
  h1 { font-size:21px; margin:14px 0 8px; }
  p { color:#475569; line-height:1.5; margin:0; }
  button, a { display:block; width:100%; margin-top:14px; height:52px; line-height:52px; border-radius:14px; font-size:17px; font-weight:700; text-decoration:none; }
  button { border:0; background:#1c2f50; color:#fff; }
  a { color:#1c2f50; background:#eef2f8; }
</style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="" />
    <h1>Can't reach your portal</h1>
    <p>You may be offline, or the portal is busy. Check your Wi-Fi or cell signal and try again.</p>
    <button onclick="retry()">Try again</button>
    <a href="index.html?switch=1">Change HOA</a>
  </div>
<script>
  function retry() {
    var u = null; try { u = JSON.parse(localStorage.getItem("hoa.current")); } catch (e) {}
    location.replace(u ? u + "/login" : "index.html?switch=1");
  }
</script>
</body>
</html>
