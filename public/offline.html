<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f1f5f9; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:#152340; }
  .card { max-width:22rem; margin:1rem; background:#fff; border:1px solid #e2e8f0; border-radius:1rem; padding:2rem 1.5rem; text-align:center; }
  img { width:64px; height:64px; border-radius:14px; }
  h1 { font-size:1.25rem; margin:1rem 0 .5rem; }
  p { color:#475569; line-height:1.5; }
  button { margin-top:1rem; height:48px; padding:0 1.5rem; border:0; border-radius:.75rem; background:#1c2f50; color:#fff; font-size:1rem; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Your committee portal needs an internet connection. Check your Wi-Fi or cell signal and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
